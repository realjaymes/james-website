# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment. Cancel any queued/in-progress run when a newer push arrives —
# for a static-content deploy, the latest commit is always what should be live, and queueing causes
# pile-ups when environment protection rules hold a run in pending state.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: generate-sitemap.py dates each <lastmod> from the file's
          # last commit. A shallow clone would collapse every page to one date.
          fetch-depth: 0
      - name: Generate sitemap
        # The sitemap is a derived artifact, rebuilt from the pages actually on
        # disk so it can never drift from the site. Regenerating here (rather
        # than failing the build on a stale file) means a forgotten commit still
        # deploys a correct sitemap.
        run: python3 tools/generate-sitemap.py --base-url https://jamespraise.xyz/ --output sitemap.xml
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
